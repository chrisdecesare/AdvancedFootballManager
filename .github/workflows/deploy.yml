name: Deploy su Altervista

# Ogni push su main carica su Altervista solo i file cambiati.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-altervista
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Carica via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}        # es. ftp.nomeutente.altervista.org
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}   # se Altervista rifiuta la connessione cifrata: variabile FTP_PROTOCOL = ftp
          local-dir: ./calcetto/
          server-dir: ${{ vars.FTP_DIR || './calcetto/' }}  # su Altervista l'FTP parte da wp-content/: il sito sta in wp-content/calcetto/
          exclude: |
            **/.git*
            **/.git*/**
            config.local.php
            config.local.php.example
            uploads/players/**
