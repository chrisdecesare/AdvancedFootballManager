name: Deploy su Altervista

# Ogni push su main carica su Altervista solo i file cambiati.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-altervista
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # azioni fissate al commit (non al tag, che chi le pubblica può spostare): il deploy riceve la password FTP
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      # Database condiviso con calcettomanager.win: il sito Next legge e scrive il database di Altervista attraverso calcetto/ponte-db.php,
      # che risponde solo a richieste firmate con DB_BRIDGE_SECRET. Il segreto sta su GitHub (e uguale su Vercel), mai nel repository:
      # qui diventa calcetto/config.bridge.php. Senza il segreto il file non c'è e il ponte resta spento (404).
      - name: Segreto del ponte verso il database, se c'è
        env:
          DB_BRIDGE_SECRET: ${{ secrets.DB_BRIDGE_SECRET }}
        run: |
          if [ -z "$DB_BRIDGE_SECRET" ]; then echo "DB_BRIDGE_SECRET non impostato: ponte spento"; exit 0; fi
          if [ ${#DB_BRIDGE_SECRET} -lt 32 ]; then echo "DB_BRIDGE_SECRET troppo corto (minimo 32 caratteri)"; exit 1; fi
          php -r '
            echo "<?php\n// Scritto dal deploy (GitHub Actions): segreto del ponte verso il database (ponte-db.php). Si può solo includere.\n";
            echo "if (realpath(\$_SERVER[\"SCRIPT_FILENAME\"] ?? \"\") === __FILE__) { http_response_code(404); exit; }\n";
            echo "define(\"DB_BRIDGE_SECRET\", " . var_export(getenv("DB_BRIDGE_SECRET"), true) . ");\n";
          ' > calcetto/config.bridge.php
          php -l calcetto/config.bridge.php

      - name: Carica via FTP
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65   # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}        # es. ftp.nomeutente.altervista.org
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps   # sempre cifrato: con l'FTP semplice password e codice viaggerebbero in chiaro
          local-dir: ./calcetto/
          server-dir: ${{ vars.FTP_DIR || './calcetto/' }}  # su Altervista l'FTP parte da wp-content/: il sito sta in wp-content/calcetto/
          exclude: |
            **/.git*
            **/.git*/**
            config.local.php
            config.local.php.example
            uploads/players/**

      # Solo su Altervista/WordPress: fa aprire il gestionale dall'indirizzo principale del sito.
      # Finisce in wp-content/mu-plugins/ (WordPress lo carica da solo, senza attivarlo).
      - name: Carica il redirect della home (mu-plugin)
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65   # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./wordpress/mu-plugins/
          server-dir: ./mu-plugins/
